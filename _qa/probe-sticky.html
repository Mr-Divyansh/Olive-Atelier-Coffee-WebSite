<!doctype html><html><head><meta charset="utf-8"><title>sh</title></head><body>
<iframe id="f" src="../index.html" style="position:absolute;left:-6000px;top:0;width:1440px;height:900px;border:0;visibility:hidden"></iframe>
<pre id="out">running</pre>
<script>
(function(){
  var f=document.getElementById("f");
  var t0=Date.now();
  (function tick(){
    var ready=f.contentDocument&&f.contentDocument.readyState!=="loading";
    if(!ready&&Date.now()-t0<8000)return void setTimeout(tick,200);
    setTimeout(function(){
      var d=f.contentDocument,w=d.defaultView;
      var hdr=d.querySelector(".site-header");
      var pos=w.getComputedStyle(hdr).position;
      var before=hdr.classList.contains("is-scrolled");
      w.scrollTo(0,400);
      w.dispatchEvent(new w.Event("scroll"));
      var after=hdr.classList.contains("is-scrolled");
      var shadow=w.getComputedStyle(hdr).boxShadow;
      var out={position:pos, beforeScroll:before, afterScroll:after, shadow:shadow};
      document.getElementById("out").textContent="@@RESULTS@@"+JSON.stringify(out)+"@@END@@";
      document.title="probe-done";
    },900);
  })();
})();
</script></body></html>

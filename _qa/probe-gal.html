<!doctype html><html><head><meta charset="utf-8"><title>gp</title></head><body style="margin:0">
<iframe id="f" src="../index.html" style="position:absolute;left:-6000px;top:0;width:1440px;height:900px;border:0;visibility:hidden"></iframe>
<pre id="out">running</pre>
<script>
(function(){
  var f=document.getElementById("f");var t0=Date.now();
  (function tick(){var ready=f.contentDocument&&f.contentDocument.readyState!=="loading";if(!ready&&Date.now()-t0<8000)return void setTimeout(tick,200);
    setTimeout(function(){var d=f.contentDocument;var g=d.querySelector(".gallery-section");var b=g.getBoundingClientRect();
      var out={top:Math.round(b.top+window.scrollY),h:Math.round(b.height)};
      document.getElementById("out").textContent="@@RESULTS@@"+JSON.stringify(out)+"@@END@@";document.title="probe-done";},900);
  })();
})();
</script></body></html>
